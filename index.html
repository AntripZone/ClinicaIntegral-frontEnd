<!doctype html>
<html lang="es">
  <head>
    <script>
      try {
        var guardado = JSON.parse(localStorage.getItem('tema-storage'));
        var tema = guardado ? guardado.state.tema
          : (matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro');
        if (tema === 'oscuro') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediClinic — Clinic Management Dashboard</title>
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
